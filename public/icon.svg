<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Material 3 Surface Dark Elevation Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Bogotá Gold / Solar Risk Prevention -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Bogotá Crimson / Alert & Emergency Management -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Climate / Atmospheric Sky Blue -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Hydrology & Water Monitoring Blue -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="m3Elevation" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Material 3 Adaptive Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.35" />

  <!-- IDIGER Emblem Geometry (Minimalist, Material Design, Zero Text) -->
  <g filter="url(#m3Elevation)">
    <!-- Top Climate & Atmosphere Facet -->
    <path d="M 256 90 L 380 172 L 256 235 L 132 172 Z" fill="url(#skyGrad)" />

    <!-- Left Prevention & Solar Resilience Facet (Bogotá Gold) -->
    <path d="M 118 188 L 242 250 L 242 398 L 118 326 Z" fill="url(#goldGrad)" />

    <!-- Right Emergency & Alert Response Facet (Bogotá Red) -->
    <path d="M 394 188 L 394 326 L 270 398 L 270 250 Z" fill="url(#redGrad)" />

    <!-- Center-Bottom Hydrology Anchor Point (Pure Water Blue) -->
    <path d="M 256 260 L 364 322 L 256 430 L 148 322 Z" fill="url(#blueGrad)" opacity="0.95" />

    <!-- Minimalist Central Sensor Core (Pure white geometric diamond) -->
    <polygon points="256,236 276,260 256,284 236,260" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
